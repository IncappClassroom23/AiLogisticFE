<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drivers — AI Logistics Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>
<body>
<div class="app-shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="app-sidebar" id="appSidebar">
    <a href="admin-dashboard" class="navbar-brand mb-4 d-inline-flex"><span class="brand-mark">AL</span>AI Logistics</a>
    <div class="sidebar-section-label">Admin</div>
    <a href="admin-dashboard" class="sidebar-link active"><i class="bi bi-grid-1x2"></i>Dashboard</a>
    <a href="drivers" class="sidebar-link"><i class="bi bi-people"></i>Drivers</a>
    <div class="sidebar-section-label">Account</div>
    <a th:href="@{/logout}"  class="sidebar-link logout-link"><i class="bi bi-box-arrow-right"></i>Log out</a>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-sm btn-ghost-light d-lg-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
        <div class="fw-semibold">Driver management</div>
      </div>
    </div>

    <div class="app-content">
      <div class="d-flex flex-wrap gap-2 mb-3" id="filterBar">
        <a th:href="@{/admin/drivers}" class="btn btn-sm btn-ghost-light active" data-filter="all">All</a>
        <a th:href="@{/admin/drivers(status='Pending')}" class="btn btn-sm btn-ghost-light" data-filter="pending">Pending</a>
        <a th:href="@{/admin/drivers(status='Activated')}" class="btn btn-sm btn-ghost-light" data-filter="approved">Approved</a>
        <a th:href="@{/admin/drivers(status='Rejected')}" class="btn btn-sm btn-ghost-light" data-filter="rejected">Rejected</a>
      </div>

      <div class="panel">
        <div class="table-responsive">
          <table class="table table-manifest align-middle mb-0">
            <thead>
              <tr><th>Driver</th><th>Contact</th><th>Vehicle</th><th>Vehicle No</th><th>Status</th><th class="text-end">Actions</th></tr>
            </thead>
            <tbody id="driverRows">
            	<tr th:each="driver : ${drivers}">
	            	<td th:text='${driver.name}'></td>
	            	<td th:text='${driver.phone}'></td>
	            	<td th:text='${driver.vehicle_type}'></td>
	            	<td th:text='${driver.vehicle_rc_no}'></td>
	            	<td th:text='${driver.status}'></td>
	            	<th class="text-end">
	            		<form th:action="@{/admin/DriverDetails}" method="post">
                   			<input type="hidden" name="email" th:value="${driver.email}" />
                   			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
							<button class="btn btn-primary">View Driver</button>
                   		</form>
	            		<a class="btn btn-success" th:href="@{/admin/DriverStatus(status='Activated', email=${driver.email})}">Activate</a>
	            		<a class="btn btn-danger" th:href="@{/admin/DriverStatus(status='Deactivated', email=${driver.email})}">Deactivate</a>
	            		<a class="btn btn-danger" th:href="@{/admin/DriverStatus(status='Rejected', email=${driver.email})}">Reject</a>
	            	</th>
            	</tr>
            </tbody>
          </table>
        </div>
        <div id="emptyState" class="empty-state d-none"><i class="bi bi-people"></i>No drivers in this filter.</div>
      </div>
    </div>
  </main>
</div>

<!-- Delete confirm modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="background:var(--navy-800); color:var(--paper); border:1px solid var(--line-soft);">
      <div class="modal-header border-0">
        <h5 class="modal-title">Delete driver?</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted-light mb-0">This permanently removes <span class="fw-semibold" id="deleteDriverName">—</span> from the network. This can't be undone.</p>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-ghost-light btn-sm" data-bs-dismiss="modal">Keep driver</button>
        <button type="button" class="btn btn-danger-soft btn-sm" id="confirmDeleteBtn">Delete driver</button>
      </div>
    </div>
  </div>
</div>

<!-- Driver profile modal -->
<div class="modal fade" id="viewModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="background:var(--navy-800); color:var(--paper); border:1px solid var(--line-soft);">
      <div class="modal-header border-0">
        <h5 class="modal-title">Driver profile</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="viewModalBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./assets/js/store.js"></script>
<script src="./assets/js/app.js"></script>
</body>
</html>
