<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Log in — AI Logistics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>
<body>

<div class="auth-shell">
  <div class="auth-form-side">
    <div class="auth-card">
      <a href="/" class="navbar-brand d-inline-flex mb-4"><span class="brand-mark">AL</span>AI Logistics</a>
      <h3>Forget Password</h3>
      <p class="text-muted-light small mb-4">Enter your registered mail id. We will send password reset link.</p>

	  <p th:if="${success}" th:text="${success}" class="alert alert-success"></p>
	  <p th:if="${error}" th:text="${error}" class="alert alert-danger"></p>
	  <form action="forgetPasswordLogic" method="post"  id="loginForm">
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input name="email" type="email" class="form-control" id="lEmail" placeholder="you@example.com" required>
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
		<button type="submit" class="btn btn-amber w-100 mt-3" id="loginBtn">Submit</button>
      </form>
      <p class="text-muted-light small mt-4 text-center">New here? <a href="register" class="text-amber">Create an account</a></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
