<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Book Shipment — AI Logistics</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	
	<meta name="_csrf" th:content="${_csrf.token}">
	<meta name="_csrf_header" th:content="${_csrf.headerName}">
	
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
	<link rel="stylesheet" th:href="@{/assets/css/style.css}">
	
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap"/>
	
	<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
	
</head>

<body>
	<div class="app-shell">
		<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
		<aside class="app-sidebar" id="appSidebar">
			<a href="customer-dashboard" class="navbar-brand mb-4 d-inline-flex"><span class="brand-mark">AL</span>AI
				Logistics</a>
			<div class="sidebar-section-label">Customer</div>
			<a href="customer-dashboard" class="sidebar-link"><i class="bi bi-grid-1x2"></i>Dashboard</a> <a
				href="book-shipment" class="sidebar-link active"><i class="bi bi-box-seam"></i>Book
				Shipment</a> <a href="shipments" class="sidebar-link"><i class="bi bi-list-ul"></i>My Shipments</a>
			<div class="sidebar-section-label">Account</div>
			<a th:href="@{/logout}" class="sidebar-link logout-link"><i class="bi bi-box-arrow-right"></i>Log out</a>
		</aside>

		<main class="app-main">
			<div class="app-topbar">
				<div class="d-flex align-items-center gap-3">
					<button class="btn btn-sm btn-ghost-light d-lg-none" id="sidebarToggle">
						<i class="bi bi-list"></i>
					</button>
					<div class="fw-semibold">Book a shipment</div>
				</div>
				<div class="avatar-chip user-chip-slot">—</div>
			</div>

			<div class="app-content">

				<div class="g-4">
					<div class="panel">
						<h5 class="mb-3">Shipment details</h5>
						<div class="g-2">
							<div style="margin-top: 8px;">
							    <iframe
							        width="100%"
							        height="300"
							        style="border: 0; border-radius: 8px;"
							        loading="lazy"
							        allowfullscreen
							        th:src="@{'https://maps.google.com/maps?output=embed&saddr='
							            + ${pickup_latitude} + ',' + ${pickup_longitude}
							            + '&daddr='
							            + ${drop_latitude} + ',' + ${drop_longitude}}">
							    </iframe>
							</div>
							<div class="row align-items-center p-2 mx-0 rounded bg-light">
								
								<div id="distanceInfo" class="col-sm text-end text-dark"
									style="margin-top:6px;font-size:.8rem;">
									📍 Calculating distance...
								</div>
							</div>
						</div>
						<form id="bookForm" th:action="@{/customer/PayNow}" method="post">

						    <div class="mt-3">
						        <label class="form-label">Vehicle:</label>
						        <input type="text" name="vtype" th:value="${vtype}"
						               class="form-control" readonly required>
						    </div>

						    <div class="mt-3">
						        <label class="form-label">
						            Goods description <small>(Optional)</small>
						        </label>
						        <input type="text" name="description"
						               class="form-control" id="goods"
						               placeholder="e.g. Packaged electronics (cartons)">
						    </div>

						    <br>
						    <h5 class="mb-3">Assigned Driver Details</h5>

						    <div th:if="${driver != null}" class="row g-3 mt-1">
						        <div class="col-6">
						            <label class="form-label">Driver Email</label>
						            <input type="text" name="driver_id"
						                   class="form-control"
						                   th:value="${driver.email}" readonly required>
						        </div>

						        <div class="col-6">
						            <label class="form-label">Driver Name</label>
						            <input type="text" name="driver_name"
						                   class="form-control"
						                   th:value="${driver.name}" readonly required>
						        </div>
						    </div>

						    <p th:if="${driver == null}" class="alert alert-danger">
						        No Driver Available!
						    </p>

						    <div class="mt-3">
						        <input type="hidden" name="amount" id="price" required>

						        <input type="hidden" name="pickup_latitude"
						               th:value="${pickup_latitude}">
						        <input type="hidden" name="pickup_longitude"
						               th:value="${pickup_longitude}">
						        <input type="hidden" name="drop_latitude"
						               th:value="${drop_latitude}">
						        <input type="hidden" name="drop_longitude"
						               th:value="${drop_longitude}">
							   <input type="hidden" name="pickup_address"
							   		   th:value="${pickup_address}">
							   <input type="hidden" name="drop_address"
									   th:value="${drop_address}">
						    </div>
							<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
						    <button th:if="${driver != null}" type="submit"
						            class="btn btn-amber w-100 mt-4" id="submitBtn">
						        <i class="bi bi-send-check me-1"></i>Pay Now
						    </button>

						</form>

						
						<script>
						document.getElementById("bookForm").addEventListener("submit",
						    async function(e) {

						        e.preventDefault();

						        const form = this;
						        const button = document.getElementById("submitBtn");

						        try {
						            button.disabled = true;

						            // Get dynamic amount from the form
						            const amount = document.getElementById("price").value;

						            if (!amount || Number(amount) <= 0) {
						                throw new Error("Invalid payment amount");
						            }
									
									const csrfToken =
									    document.querySelector('meta[name="_csrf"]').content;

									const csrfHeader =
									    document.querySelector('meta[name="_csrf_header"]').content;

						            // Create Razorpay order
									let response = await fetch(
									    "/create-order?" +
									    new URLSearchParams({ amount: amount }),
									    {
									        method: "POST",
									        headers: {
									            [csrfHeader]: csrfToken
									        }
									    }
									);

						            if (!response.ok) {
						                throw new Error("Unable to create payment order");
						            }

						            const order = await response.json();

						            const options = {
						                key: order.key,
						                amount: order.amount,
						                currency: "INR",
						                order_id: order.id,

						                name: "AI Logistics",
						                description: "Shipment Booking",

						                handler: async function(payment) {
						                    try {
						                        // Verify payment in Spring Boot
												let result = await fetch("/save-payment", {
												    method: "POST",
												    headers: {
												        "Content-Type": "application/json",
												        [csrfHeader]: csrfToken
												    },
												    body: JSON.stringify({
												        paymentId: payment.razorpay_payment_id,
												        orderId: payment.razorpay_order_id,
												        signature: payment.razorpay_signature
												    })
												});

						                        if (!result.ok) {
						                            throw new Error("Payment verification failed");
						                        }

						                        alert("Payment Successful");

						                        // Submit ALL form parameters to your existing controller
						                        form.submit();

						                    } catch (error) {
						                        alert(error.message);
						                        button.disabled = false;
						                    }
						                },

						                modal: {
						                    ondismiss: function() {
						                        button.disabled = false;
						                    }
						                }
						            };

						            const checkout = new Razorpay(options);

						            checkout.on("payment.failed", function() {
						                alert("Payment failed. Please try again.");
						                button.disabled = false;
						            });

						            checkout.open();

						        } catch (error) {
						            alert(error.message);
						            button.disabled = false;
						        }
						    });
						</script>
						

						<script th:inline="javascript">
						    function getDistance() {

						        const distanceInfo = document.getElementById("distanceInfo");
						        const priceElement = document.getElementById("price");

						        // Get coordinates from Thymeleaf
						        const pickupLat = Number(/*[[${pickup_latitude}]]*/ 0);
						        const pickupLng = Number(/*[[${pickup_longitude}]]*/ 0);

						        const dropLat = Number(/*[[${drop_latitude}]]*/ 0);
						        const dropLng = Number(/*[[${drop_longitude}]]*/ 0);

						        const rate = Number(/*[[${vrate}]]*/ 0);

						        // Validate coordinates
						        if (
						            !Number.isFinite(pickupLat) ||
						            !Number.isFinite(pickupLng) ||
						            !Number.isFinite(dropLat) ||
						            !Number.isFinite(dropLng) ||
						            pickupLat < -90 || pickupLat > 90 ||
						            dropLat < -90 || dropLat > 90 ||
						            pickupLng < -180 || pickupLng > 180 ||
						            dropLng < -180 || dropLng > 180
						        ) {
						            distanceInfo.textContent = "Invalid pickup or drop coordinates.";
						            return;
						        }

						        distanceInfo.textContent = "📍 Calculating distance and amount...";

						        // OSRM requires longitude,latitude order
						        const url =
						            `https://router.project-osrm.org/route/v1/driving/` +
						            `${pickupLng},${pickupLat};${dropLng},${dropLat}` +
						            `?overview=false`;

						        fetch(url)
						            .then(response => {
						                if (!response.ok) {
						                    throw new Error("HTTP error: " + response.status);
						                }
						                return response.json();
						            })
						            .then(data => {

						                if (
						                    data.code !== "Ok" ||
						                    !data.routes ||
						                    data.routes.length === 0
						                ) {
						                    throw new Error(data.message || "Route not found");
						                }

						                const route = data.routes[0];

						                const distanceKm = route.distance / 1000;
						                const durationMin = Math.round(route.duration / 60);
						                const price = parseInt(distanceKm * rate);

						                distanceInfo.innerHTML =
						                    `🚗 Distance: <b>${distanceKm.toFixed(2)}</b> km` +
						                    ` | ₹ Amount: <b>${price}</b>` +
											` | ⏱ ETA: <b>${durationMin}</b> mins`;

						                priceElement.value = price;
						            })
						            .catch(error => {
						                console.error("Distance calculation error:", error);

						                distanceInfo.textContent =
						                    "Unable to calculate distance. Please try again.";

						                priceElement.value = "0";
						            });
						    }

						    document.addEventListener("DOMContentLoaded", getDistance);
						</script>
					</div>
				</div>

			</div>
		</main>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="./assets/js/store.js"></script>
	<script src="./assets/js/ai.js"></script>
	<script src="./assets/js/app.js"></script>
</body>

</html>
