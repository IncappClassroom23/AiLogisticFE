<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard — AI Logistics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>
<body>
<div class="app-shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="app-sidebar" id="appSidebar">
    <a href="customer-dashboard" class="navbar-brand mb-4 d-inline-flex"><span class="brand-mark">AL</span>AI Logistics</a>
    <div class="sidebar-section-label">Customer</div>
    <a href="customer-dashboard" class="sidebar-link active"><i class="bi bi-grid-1x2"></i>Dashboard</a>
    <a href="book-shipment" class="sidebar-link"><i class="bi bi-box-seam"></i>Book Shipment</a>
    <a href="shipments" class="sidebar-link"><i class="bi bi-list-ul"></i>My Shipments</a>
    <div class="sidebar-section-label">Account</div>
    <a th:href="@{/logout}" class="sidebar-link logout-link"><i class="bi bi-box-arrow-right"></i>Log out</a>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-sm btn-ghost-light d-lg-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
        <div>
          <div class="fw-semibold user-name-slot"> Welcome: <span  th:text='${session.customer.name}'></span> </div>
          <div class="small text-muted-light">Customer account</div>
        </div>
      </div>
      <div class="d-flex align-items-center gap-3">
        <a href="book-shipment" class="btn btn-amber btn-sm d-none d-sm-inline-flex"><i class="bi bi-plus-lg me-1"></i>Book shipment</a>
        <div class="avatar-chip user-chip-slot">—</div>
      </div>
    </div>

    <div class="app-content">
      <h3 class="mb-1">Good to see you, <span class="user-name-slot">there</span> 👋</h3>
      <p class="text-muted-light mb-4">Here's what's moving today.</p>

      <div class="row g-3" id="statCards"></div>

      <div class="row g-4 mt-1">
        <div class="col-lg-8">
          <div class="panel">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="mb-0">Recent shipments</h5>
              <a th:href="@{/customer/shipments(status='Pending')}" class="small text-amber">View all <i class="bi bi-arrow-right"></i></a>
            </div>
            <div id="recentList"></div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="panel mt-3">
            <h6 class="mb-3">Quick actions</h6>
            <a href="book-shipment" class="btn btn-outline-amber btn-sm w-100 mb-2"><i class="bi bi-box-seam me-1"></i>Book a new shipment</a>
            <a href="shipments" class="btn btn-ghost-light btn-sm w-100"><i class="bi bi-search me-1"></i>Track a shipment</a>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./assets/js/store.js"></script>
<script src="./assets/js/app.js"></script>
</body>
</html>
