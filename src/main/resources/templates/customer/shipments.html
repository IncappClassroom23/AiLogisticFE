<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Book Shipment — AI Logistics</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
	<link rel="stylesheet" th:href="@{/assets/css/style.css}">

</head>

<body>
	<div class="app-shell">
		<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
		<aside class="app-sidebar" id="appSidebar">
			<a href="customer-dashboard" class="navbar-brand mb-4 d-inline-flex"><span class="brand-mark">AL</span>AI
				Logistics</a>
			<div class="sidebar-section-label">Customer</div>
			<a href="customer-dashboard" class="sidebar-link"><i class="bi bi-grid-1x2"></i>Dashboard</a> <a
				href="book-shipment" class="sidebar-link active"><i class="bi bi-box-seam"></i>Book
				Shipment</a> <a href="shipments" class="sidebar-link"><i class="bi bi-list-ul"></i>My Shipments</a>
			<div class="sidebar-section-label">Account</div>
			<a th:href="@{/logout}" class="sidebar-link logout-link"><i class="bi bi-box-arrow-right"></i>Log out</a>
		</aside>


		  <main class="app-main">
		    <div class="app-topbar">
		      <div class="d-flex align-items-center gap-3">
		        <button class="btn btn-sm btn-ghost-light d-lg-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
		        <div class="fw-semibold">My shipments</div>
		      </div>
		      <a href="book-shipment" class="btn btn-amber btn-sm"><i class="bi bi-plus-lg me-1"></i>Book shipment</a>
		    </div>
		
		    <div class="app-content">
		      <div class="d-flex flex-wrap gap-2 mb-3" id="filterBar">
				<a th:href="@{/customer/shipments}" class="btn btn-sm btn-ghost-light active">All</a>
				<a th:href="@{/customer/shipments(status='Pending')}" class="btn btn-sm btn-ghost-light">Pending</a>
				<a th:href="@{/customer/shipments(status='InTransit')}" class="btn btn-sm btn-ghost-light">In Transit</a>
				<a th:href="@{/customer/shipments(status='Delivered')}" class="btn btn-sm btn-ghost-light">Delivered</a>
				<a th:href="@{/customer/shipments(status='Cancelled')}" class="btn btn-sm btn-ghost-light">Cancelled</a>
		      </div>
		
		      <div class="panel">
				<div class="table-responsive">
		          <table class="table table-manifest align-middle mb-0">
		            <thead>
		              <th>Shipment ID</th><th>Description</th><th>Driver</th><th>Vehicle</th><th>Status</th><th>Pickup Date</th><th class="text-end">Actions</th>
		            </thead>
		            <tbody >
		            	<tr th:each="shipment : ${shipments}">
			            	<td th:text='${shipment.id}'></td>
			            	<td th:text='${shipment.description}'></td>
			            	<td th:text='${shipment.driver_name}'></td>
			            	<td th:text='${shipment.vtype}'></td>
			            	<td th:text='${shipment.status}'></td>
							<td th:text="${#temporals.format(shipment.pickup_datetime, 'dd MMM yyyy hh:mm a')}"></td>
			            	<th class="text-end">
			            		<form th:action="@{/shipment/ShipmentDetails}" method="post">
		                   			<input type="hidden" name="id" th:value="${shipment.id}" />
		                   			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
									<button class="btn btn-primary">View Shipment</button>
		                   		</form>
								<a th:if="${shipment.status != 'Delivered' and shipment.status != 'Cancelled'}"
								   class="btn btn-danger"
								   th:href="@{/shipment/ShipmentStatus(status='Cancelled', id=${shipment.id})}">
								    Cancel
								</a>
			            	</th>
		            	</tr>
		            </tbody>
		          </table>
		        </div>
		      </div>
		    </div>
		  </main>
		</div>

</body>
</html>
